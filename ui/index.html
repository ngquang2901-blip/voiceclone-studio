<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceClone Studio</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; media-src * blob: data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav id="rail" class="rail" aria-label="Điều hướng chính"></nav>
  <div class="shell">
    <header class="topbar">
      <h1 id="title">VoiceClone Studio</h1>
      <div id="topright" class="topright"></div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div class="body">
      <aside id="panel" class="panel" aria-label="Bảng bên"></aside>
      <main id="main" class="main"></main>
    </div>
  </div>
</div>
<div id="offline" class="offline" hidden role="alert">
  <div class="offline-box">
    <h2>Không kết nối được engine</h2>
    <p>Engine giọng nói chưa chạy hoặc đang khởi động. Hãy thử lại sau vài giây.</p>
    <button id="retry" class="btn primary">Thử lại</button>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
